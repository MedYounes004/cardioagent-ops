services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8001/process
      ORCHESTRATOR_URL: http://agent-orchestrator:8002/analyze
    depends_on:
      audio-engine:
        condition: service_healthy
      agent-orchestrator:
        condition: service_healthy
    networks:
      - cardio-network

  audio-engine:
    build:
      context: ./audio-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cardio-network

  mlflow-server:
    build:
      context: ./mlflow-server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/mlruns
      - mlflow-artifacts:/mlflow/artifacts
    networks:
      - cardio-network

  agent-orchestrator:
    build:
      context: ./agent-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-cardio-qwen}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cardio-network

volumes:
  mlflow-data:
  mlflow-artifacts:
  
networks:
  cardio-network:
    driver: bridge
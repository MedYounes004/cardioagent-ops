services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8001/process
      ORCHESTRATOR_URL: http://agent-orchestrator:8002/analyze
    depends_on:
      audio-engine:
        condition: service_healthy
    networks:
      - cardio-network

  audio-engine:
    build:
      context: ./audio-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cardio-network

networks:
  cardio-network:
    driver: bridge
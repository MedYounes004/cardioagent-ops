name: MLOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-gateway/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api-gateway
          path: api-gateway/coverage.xml

  build-api-gateway:
    runs-on: ubuntu-latest
    needs: test-api-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t api-gateway:${{ github.sha }} ./api-gateway

  test-audio-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: audio-engine/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-audio-engine
          path: audio-engine/coverage.xml

  build-audio-engine:
    runs-on: ubuntu-latest
    needs: test-audio-engine
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t audio-engine:${{ github.sha }} ./audio-engine
  
  build-mlflow-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mlflow-server:${{ github.sha }} ./mlflow-server